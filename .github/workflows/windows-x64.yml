name: Windows x64 Release

on:
  workflow_dispatch:
  push:
    branches:
      - popular-windows-x64

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build AyuGram Popular Messages 2
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: cmd
    env:
      QT: 5.15.18
      SDK: 10.0.26100.0
      PYTHONUTF8: 1
      GYP_MSVS_OVERRIDE_PATH: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\
      GYP_MSVS_VERSION: 2022
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - name: Prepare directories
        run: |
          mkdir %USERPROFILE%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %USERPROFILE%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LIBRARIES=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Checkout enhanced source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
          path: TBuild/tdesktop
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'

      - name: Verify dependency cleanup handles read-only Git files
        working-directory: TBuild/tdesktop
        run: python .github\scripts\test_windows_ci.py

      - name: Set up Visual Studio 2022 x64
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c
        with:
          arch: x64
          sdk: ${{ env.SDK }}

      - name: Apply existing range-v3 compatibility fix
        working-directory: TBuild/tdesktop
        run: git -C Telegram\ThirdParty\range-v3 apply ..\..\..\.github\patches\range-v3.patch

      - name: Verify popular messages index and cache with MSVC
        working-directory: TBuild/tdesktop
        run: |
          mkdir ci-tests
          cl /nologo /std:c++20 /EHsc /W4 /I Telegram\SourceFiles /Fe:ci-tests\channel_popular_index_test.exe /Fo:ci-tests\channel_popular_index_test.obj Telegram\SourceFiles\ayu\features\channel_popular\channel_popular_index_test.cpp
          if errorlevel 1 exit /b 1
          ci-tests\channel_popular_index_test.exe

      - name: Check credentials and compute dependency cache key
        shell: pwsh
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if ($env:TDESKTOP_API_ID -notmatch '^[1-9][0-9]*$' -or $env:TDESKTOP_API_HASH -notmatch '^[a-fA-F0-9]{32}$') {
            throw 'Configure TDESKTOP_API_ID and TDESKTOP_API_HASH repository secrets.'
          }
          $prepare = (Get-FileHash "$env:TBUILD/tdesktop/Telegram/build/prepare/prepare.py" -Algorithm SHA256).Hash
          $qt = (Get-FileHash "$env:TBUILD/tdesktop/Telegram/build/qt_version.py" -Algorithm SHA256).Hash
          $compiler = (Get-Item (Get-Command cl.exe).Source).VersionInfo.FileVersion -replace '[^a-zA-Z0-9.-]', '_'
          "CACHE_KEY=$prepare-$qt-$env:SDK-$compiler-py310-v1" >> $env:GITHUB_ENV

      - name: Configure NuGet
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Name nuget.org -Source https://api.nuget.org/v3/index.json
          exit /b 0

      - name: Restore ThirdParty cache
        id: third-party
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: Windows-x64-third-party-${{ env.CACHE_KEY }}
          restore-keys: Windows-x64-third-party-${{ env.CACHE_KEY }}-partial-

      - name: Restore libraries cache
        id: libraries
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ env.LIBRARIES }}\*
            !${{ env.LIBRARIES }}\cache_keys
            !${{ env.LIBRARIES }}\[qQ]t[_-]*
            ${{ env.LIBRARIES }}\cache_keys\*
            !${{ env.LIBRARIES }}\cache_keys\[qQ]t[_-]*
          key: Windows-x64-libs-${{ env.CACHE_KEY }}
          restore-keys: Windows-x64-libs-${{ env.CACHE_KEY }}-partial-

      - name: Restore Qt cache
        id: qt
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ env.LIBRARIES }}\[qQ]t[_-]*
            ${{ env.LIBRARIES }}\cache_keys\[qQ]t[_-]*
          key: Windows-x64-qt5-release-${{ env.CACHE_KEY }}
          restore-keys: Windows-x64-qt5-release-${{ env.CACHE_KEY }}-partial-

      - name: Build upstream dependencies including Release
        id: prepare
        working-directory: TBuild/tdesktop
        run: python .github\scripts\windows_ci.py prepare

      - name: Trim completed dependency outputs
        if: steps.prepare.outcome == 'success'
        working-directory: TBuild/tdesktop
        run: python .github\scripts\windows_ci.py trim

      - name: Save ThirdParty cache
        if: always() && !cancelled() && (steps.prepare.outcome == 'success' || steps.prepare.outcome == 'failure') && steps.third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ steps.prepare.outcome == 'success' && steps.third-party.outputs.cache-primary-key || format('{0}-partial-{1}-{2}', steps.third-party.outputs.cache-primary-key, github.run_id, github.run_attempt) }}

      - name: Save libraries cache
        if: always() && !cancelled() && (steps.prepare.outcome == 'success' || steps.prepare.outcome == 'failure') && steps.libraries.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ env.LIBRARIES }}\*
            !${{ env.LIBRARIES }}\cache_keys
            !${{ env.LIBRARIES }}\[qQ]t[_-]*
            ${{ env.LIBRARIES }}\cache_keys\*
            !${{ env.LIBRARIES }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.prepare.outcome == 'success' && steps.libraries.outputs.cache-primary-key || format('{0}-partial-{1}-{2}', steps.libraries.outputs.cache-primary-key, github.run_id, github.run_attempt) }}

      - name: Save Qt cache
        if: always() && !cancelled() && (steps.prepare.outcome == 'success' || steps.prepare.outcome == 'failure') && steps.qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ env.LIBRARIES }}\[qQ]t[_-]*
            ${{ env.LIBRARIES }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.prepare.outcome == 'success' && steps.qt.outputs.cache-primary-key || format('{0}-partial-{1}-{2}', steps.qt.outputs.cache-primary-key, github.run_id, github.run_attempt) }}

      - name: Build Windows x64 Release
        working-directory: TBuild/tdesktop
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: python .github\scripts\windows_ci.py build

      - name: Package portable client and installer
        working-directory: TBuild/tdesktop
        run: python .github\scripts\windows_ci.py package

      - name: Upload Windows x64 packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: AyuGramPopular-6.7.8-PopularMessages2-Windows-x64
          path: TBuild/tdesktop/releases/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Windows-x64-diagnostics-${{ github.run_attempt }}
          path: |
            TBuild/tdesktop/ci-logs/*.log
            TBuild/tdesktop/out/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
